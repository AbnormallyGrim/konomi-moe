[project]
name = "konomi"
version = "0.1.0"
description = "Local anime and manga recommendations learned from your AniList history."
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "typer>=0.12",
    "rich>=13",
    "streamlit>=1.67.0",
]

[project.scripts]
konomi = "konomi.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/konomi"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
